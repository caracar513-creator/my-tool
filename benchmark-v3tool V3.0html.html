              '<button class="agi-btn agi-btn-sm agi-btn-copy-text" title="复制 text">复制</button>' +
              '<button class="agi-btn agi-btn-sm agi-btn-render-text" title="渲染预览">渲染</button>' +
              '<span class="agi-issue-badge agi-hidden" title=""></span>' +
            '</div>' +
            '<div class="agi-text-issues agi-hidden"></div>' +
            '<div class="agi-text-render agi-hidden"></div>' +
          '</div>' +
        '</div>' +
      '</div>';

      boxList.appendChild(boxEl);

      // 点击面板标注项跳转到图片标注框
      boxEl.addEventListener('click', function(e) {
        // 如果点击的是input、select、textarea或button，不触发跳转
        var tag = e.target.tagName.toLowerCase();
        if (tag === 'input' || tag === 'select' || tag === 'textarea' || tag === 'button') return;
        jumpToImageBox(idx);
      });

      var textArea = boxEl.querySelector('.agi-field-text');
      var btnCopyText = boxEl.querySelector('.agi-btn-copy-text');
      var btnRenderText = boxEl.querySelector('.agi-btn-render-text');

      autoResizeTextarea(textArea);
      textArea.addEventListener('input', function() {
        autoResizeTextarea(textArea);
        updateIssues(textArea, boxEl);
        // 刷新已展开的渲染
        refreshOpenRender(boxEl, textArea);
      });

      textArea.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          var s = this.selectionStart, en = this.selectionEnd;
          this.value = this.value.substring(0, s) + '\\n' + this.value.substring(en);
          this.selectionStart = this.selectionEnd = s + 2;
          this.dispatchEvent(new Event('input', { bubbles: true }));
        } else if (e.key === 'Tab') {
          e.preventDefault();
          var s = this.selectionStart, en = this.selectionEnd;
          this.value = this.value.substring(0, s) + '\\t' + this.value.substring(en);
          this.selectionStart = this.selectionEnd = s + 2;
          this.dispatchEvent(new Event('input', { bubbles: true }));
        }
      });

      textArea.addEventListener('paste', function(e) {
        e.preventDefault();
        var clip = (e.clipboardData || window.clipboardData).getData('text');
        var converted = clip.replace(/\r\n|\r|\n/g, '\\n').replace(/\t/g, '\\t');
        var s = this.selectionStart, en = this.selectionEnd;
        this.value = this.value.substring(0, s) + converted + this.value.substring(en);
        this.selectionStart = this.selectionEnd = s + converted.length;
        this.dispatchEvent(new Event('input', { bubbles: true }));
      });

      btnCopyText.addEventListener('click', function() {
        copyToClipboard(textArea.value).then(function() {
          btnCopyText.textContent = '已复制';
          setTimeout(function() { btnCopyText.textContent = '复制'; }, 1500);
        });
      });

      // 渲染按钮点击事件
      btnRenderText.addEventListener('click', function() {
        var renderDiv = boxEl.querySelector('.agi-text-render');
        if (!renderDiv) return;
        
        if (renderDiv.classList.contains('agi-hidden')) {
          // 展开渲染
          var typeSelect = boxEl.querySelector('.agi-field-type');
          var type = typeSelect ? typeSelect.value : 'paragraph';
          renderDiv.innerHTML = renderTextPreview(textArea.value, type);
          renderDiv.classList.remove('agi-hidden');
          btnRenderText.textContent = '收起';
        } else {
          // 收起渲染
          renderDiv.classList.add('agi-hidden');
          btnRenderText.textContent = '渲染';
        }
      });

      updateIssues(textArea, boxEl);
    });

    boxList.querySelectorAll('input, select, textarea').forEach(function(el) {
      // 更新boxesData的通用函数
      function updateBoxData() {
        var boxItem = el.closest('.agi-box-item');
        if (!boxItem) return;
        var arrayIdx = parseInt(boxItem.dataset.index);
        if (isNaN(arrayIdx) || !boxesData[arrayIdx]) return;
        var box = boxesData[arrayIdx];
        
        // 根据字段类型更新对应的boxesData属性
        if (el.classList.contains('agi-field-index')) {
          box.index = parseInt(el.value) || 0;
        } else if (el.classList.contains('agi-field-page')) {
          box.page = parseInt(el.value) || 0;
        } else if (el.classList.contains('agi-field-type')) {
          box.type = el.value;
        } else if (el.classList.contains('agi-field-location')) {
          box.location = el.value;
        } else if (el.classList.contains('agi-field-title-level')) {
          box.title_level = parseInt(el.value) || -1;
        } else if (el.classList.contains('agi-field-attach-index')) {
          box.attach_index = el.value;
        } else if (el.classList.contains('agi-field-text')) {
          box.description = el.value;
          box.text = el.value;
        }
      }

      el.addEventListener('change', function() { 
        // 清除错误高亮
        el.classList.remove('agi-field-error');
        // 更新boxesData
        updateBoxData();
        saveToCache();
        // attach_index变化时更新关联高亮
        if (el.classList.contains('agi-field-attach-index')) {
          updateAttachHighlight();
          applyBoxGroupColors();
          toggleIsTruncatedVisibility(el);
        }
      });
      el.addEventListener('input', debounce(function() { 
        // 清除错误高亮
        el.classList.remove('agi-field-error');
        // 更新boxesData
        updateBoxData();
        saveToCache();
        // attach_index变化时更新关联高亮
        if (el.classList.contains('agi-field-attach-index')) {
          updateAttachHighlight();
          applyBoxGroupColors();
          toggleIsTruncatedVisibility(el);
        }
      }, 800));
      // 点击输入字段时自动选中内容（便于直接替换）
      if (el.classList.contains('agi-field-index') || 
          el.classList.contains('agi-field-page') || 
          el.classList.contains('agi-field-title-level') || 
          el.classList.contains('agi-field-attach-index')) {
        el.addEventListener('click', function() {
          this.select();
        });
      }
      // index字段：记录旧值，用于冲突检测
      if (el.classList.contains('agi-field-index')) {
        // focus时记录旧值
        el.addEventListener('focus', function() {
          this._oldIndex = parseInt(this.value) || 0;
        });
        el.addEventListener('change', function() {
          var newIdx = parseInt(this.value);
          if (!isNaN(newIdx) && newIdx >= 0) {
            // 找到对应的 .agi-box-item 父元素
            var boxItem = this.closest('.agi-box-item');
            if (boxItem) {
              boxItem._oldIndex = parseInt(this._oldIndex) || newIdx;
              handleIndexConflict(boxItem, newIdx);
            }
            renderAnnotationUI();
            updateAttachHighlight();
            applyBoxGroupColors();
            renderAnnotationBoxes();
            saveToCache();
          }
        });
      }
      // text区域也支持点击选中
      if (el.classList.contains('agi-field-text')) {
        el.addEventListener('focus', function() {
          // 不自动全选，保持原有行为
        });
      }
    });

    // 更新attach高亮
    updateAttachHighlight();
    // 应用关联组颜色
    applyBoxGroupColors();
    // 初始化 is_truncated 复选框可见性
    var attachInputs = boxList.querySelectorAll('.agi-field-attach-index');
    attachInputs.forEach(function(input) {
      toggleIsTruncatedVisibility(input);
    });
  }

// ========== 清除字段错误高亮 ==========
function clearFieldErrors() {
  var errorFields = boxList.querySelectorAll('.agi-field-error');
  errorFields.forEach(function(field) {
    field.classList.remove('agi-field-error');
  });
}

// ========== 验证必填字段 ==========
function validateRequiredFields() {
  clearFieldErrors();
  var firstError = null;
  var errorMessages = [];
  
  var boxItems = boxList.querySelectorAll('.agi-box-item');
  
  boxItems.forEach(function(item, idx) {
    var boxTitle = item.querySelector('.agi-box-title');
    var itemLabel = boxTitle ? boxTitle.textContent : ('第' + (idx + 1) + '项');
    
    // 验证 index
    var indexField = item.querySelector('.agi-field-index');
    if (!indexField.value.trim()) {
      indexField.classList.add('agi-field-error');
      if (!firstError) firstError = indexField;
      errorMessages.push(itemLabel + ': index为空');
    }
    
    // 验证 page
    var pageField = item.querySelector('.agi-field-page');
    if (!pageField.value.trim()) {
      pageField.classList.add('agi-field-error');
      if (!firstError) firstError = pageField;
      errorMessages.push(itemLabel + ': page为空');
    }
    
    // 验证 type
    var typeField = item.querySelector('.agi-field-type');
    if (!typeField.value.trim()) {
      typeField.classList.add('agi-field-error');
      if (!firstError) firstError = typeField;
      errorMessages.push(itemLabel + ': type为空');
    }
    
    // 验证 location
    var locationField = item.querySelector('.agi-field-location');
    if (!locationField.value.trim()) {
      locationField.classList.add('agi-field-error');
      if (!firstError) firstError = locationField;
      errorMessages.push(itemLabel + ': location为空');
    }
    
    // 验证 title_level
    var titleLevelField = item.querySelector('.agi-field-title-level');
    if (!titleLevelField.value.trim()) {
      titleLevelField.classList.add('agi-field-error');
      if (!firstError) firstError = titleLevelField;
      errorMessages.push(itemLabel + ': title_level为空');
    }
    
    // 验证 attach_index
    var attachIndexField = item.querySelector('.agi-field-attach-index');
    if (!attachIndexField.value.trim()) {
      attachIndexField.classList.add('agi-field-error');
      if (!firstError) firstError = attachIndexField;
      errorMessages.push(itemLabel + ': attach_index为空');
    }
    
    // text字段允许为空，不验证
  });
  
  if (firstError) {
    // 滚动到第一个错误字段
    firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
    firstError.focus();
    return { valid: false, errors: errorMessages };
  }
  
  return { valid: true, errors: [] };
}

// ========== 构建结果 ==========
function buildResult() {
  var validation = validateRequiredFields();
  if (!validation.valid) {
    showStatus('❌ 导出失败：存在空字段\n' + validation.errors.join('\n'), 'error');
    return null;
  }
  
  var version = 'v3.0';
  var updateTime = fetchedTime || getLocalTimeString();
  var contents = [];
  var boxItems = boxList.querySelectorAll('.agi-box-item');

  boxItems.forEach(function(item, idx) {
    var box = boxesData[idx];
    var position = coordsToPosition(box ? box.coords : null);
    var titleLevel = parseInt(item.querySelector('.agi-field-title-level').value);
    var attachRaw = item.querySelector('.agi-field-attach-index').value.trim();
    var attachArr = attachRaw === '-1' || attachRaw === '' ? [] : attachRaw.split(',').map(function(s) { return parseInt(s.trim()); }).filter(function(n) { return !isNaN(n); });
    var attachIndex = attachArr.length === 0 ? -1 : (attachArr.length === 1 ? attachArr[0] : attachArr);

    // 读取 is_truncated 复选框状态
    var isTruncated = null;
    if (attachIndex !== -1) {
      var isTruncatedCheckbox = item.querySelector('.agi-field-is-truncated');
      isTruncated = isTruncatedCheckbox ? isTruncatedCheckbox.checked : false;
    }

    // 构建 attribute 对象
    var attrObj = {
      type: item.querySelector('.agi-field-type').value,
      location: item.querySelector('.agi-field-location').value,
      title_level: isNaN(titleLevel) ? -1 : titleLevel,
      attach_index: attachIndex,
      is_truncated: isTruncated
    };

    contents.push({
      index: parseInt(item.querySelector('.agi-field-index').value) || 0,
      page: parseInt(item.querySelector('.agi-field-page').value) || 0,
      position: position || [],
      attribute: attrObj,
      text: item.querySelector('.agi-field-text').value.replace(/\r\n|\r|\n/g, '\\n').replace(/\t/g, '\\t')
    });
  });

  return { update_time: updateTime, version: version, contents: contents };
}

  // ========== 导出JSON ==========
  function handleExport() {
    var result = buildResult();
    if (!result) return;
    var jsonStr = JSON.stringify(result, null, 2);
    resultJson.value = jsonStr;
    resultArea.classList.remove('agi-hidden');
    emptyState.style.display = 'none';
    showStatus('📋 已生成JSON结果', 'info');
  }

  // ========== 缓存操作 ==========
  function getCacheKey() {
    return 'agi_annotation_cache_v2';
  }

  function saveToCache() {
    try {
      var formData = [];
      var items = boxList.querySelectorAll('.agi-box-item');
      items.forEach(function(item) {
        formData.push({
          index: item.querySelector('.agi-field-index').value,
          page: item.querySelector('.agi-field-page').value,
          type: item.querySelector('.agi-field-type').value,
          location: item.querySelector('.agi-field-location').value,
          titleLevel: item.querySelector('.agi-field-title-level').value,
          attachIndex: item.querySelector('.agi-field-attach-index').value,
          text: item.querySelector('.agi-field-text').value
        });
      });

      var cacheObj = {
        boxesData: boxesData,
        imageUrl: imageUrl,
        imageInfo: imageInfo,
        fetchedTime: fetchedTime,
        formData: formData,
        version: 'v3.0',
        savedAt: getLocalTimeString()
      };

      safeStorageSet(getCacheKey(), cacheObj);
    } catch(e) {}
  }

  function restoreFromCache() {
    try {
      var cache = safeStorageGet(getCacheKey());
      if (!cache || !cache.boxesData || cache.boxesData.length === 0) return false;

      boxesData = cache.boxesData;
      imageUrl = cache.imageUrl || '';
      imageInfo = cache.imageInfo;
      fetchedTime = cache.fetchedTime;

      // 恢复图片
      if (imageUrl) {
        loadImage(imageUrl);
      }

      renderAnnotationUI();

      if (cache.formData) {
        var items = boxList.querySelectorAll('.agi-box-item');
        cache.formData.forEach(function(fd, i) {
          if (i >= items.length) return;
          var el = items[i];
          el.querySelector('.agi-field-index').value = fd.index;
          el.querySelector('.agi-field-page').value = fd.page;

          var typeSelect = el.querySelector('.agi-field-type');
          for (var k = 0; k < typeSelect.options.length; k++) {
            if (typeSelect.options[k].value === fd.type) {
              typeSelect.selectedIndex = k;
              break;
            }
          }

          var locSelect = el.querySelector('.agi-field-location');
          for (var k = 0; k < locSelect.options.length; k++) {
            if (locSelect.options[k].value === fd.location) {
              locSelect.selectedIndex = k;
              break;
            }
          }

          el.querySelector('.agi-field-title-level').value = fd.titleLevel;
          el.querySelector('.agi-field-attach-index').value = fd.attachIndex;
          if (fd.text !== undefined) {
            var ta = el.querySelector('.agi-field-text');
            ta.value = fd.text.replace(/\\n/g, '\n').replace(/\\t/g, '\t');
            autoResizeTextarea(ta);
            updateIssues(ta, el);
          }
        });
      }

      updateAttachHighlight();
      // 应用关联组颜色
      applyBoxGroupColors();
      showStatus('💾 已从缓存恢复 ' + boxesData.length + ' 个标注', 'info');

      requestAnimationFrame(function() {
        var allTas = boxList.querySelectorAll('.agi-field-text');
        for (var tti = 0; tti < allTas.length; tti++) {
          autoResizeTextarea(allTas[tti]);
        }
      });

      return true;
    } catch(e) {
      return false;
    }
  }

  function handleClearCache() {
    if (!confirm('确定清除当前页面的缓存数据？此操作不可撤销。')) return;
    safeStorageRemove(getCacheKey());
    boxesData = [];
    imageUrl = '';
    imageInfo = null;
    fetchedTime = '';
    annotationArea.classList.add('agi-hidden');
    resultArea.classList.add('agi-hidden');
    boxList.innerHTML = '';
    emptyState.style.display = '';
    
    // 清除图片和PDF
    imageEl.src = '';
    imageEl.classList.add('agi-hidden');
    pdfCanvas.classList.add('agi-hidden');
    pdfToolbar.classList.add('agi-hidden');
    pdfDoc = null;
    pdfCurrentPage = 1;
    pdfTotalPages = 0;
    currentContentType = 'none';
    imageLoading.style.display = 'block';
    imageLoading.textContent = '等待加载图片或PDF...';
    
    // 清除标注框
    var oldBoxes = imageWrapper.querySelectorAll('.agi-annotation-box');
    for (var i = 0; i < oldBoxes.length; i++) {
      oldBoxes[i].parentNode.removeChild(oldBoxes[i]);
    }
    
    showStatus('🗑️ 缓存已清除', 'success');
  }

  // ========== 标准化导入项 ==========
  function normalizeItem(raw) {
    var item = {};
    item.index = raw.index;
    item.page = raw.page !== undefined ? raw.page : 0;
    item.position = raw.position;
    item.text = raw.text !== undefined ? raw.text : '';

    var attr = raw.attribute || {};
    item.type = attr.type || raw.type || 'paragraph';
    item.location = attr.location || raw.location || 'main';
    item.title_level = attr.title_level !== undefined ? attr.title_level : (raw.title_level !== undefined ? raw.title_level : -1);
    item.attach_index = attr.attach_index !== undefined ? attr.attach_index : (raw.attach_index !== undefined ? raw.attach_index : -1);

    if (raw.version) item.version = raw.version;

    return item;
  }

  // ========== 面板缩放控制 ==========
  var MIN_ZOOM = 0.7;
  var MAX_ZOOM = 1.5;

  function initPanelZoom() {
    var saved = parseFloat(safeStorageGet('agi_panel_zoom'));
    if (!isNaN(saved) && saved >= MIN_ZOOM && saved <= MAX_ZOOM) {
      panelZoom = saved;
    }
    applyPanelZoom();
  }

  function setPanelZoom(zoom) {
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, Math.round(zoom * 10) / 10));
    if (zoom === panelZoom) return;
    panelZoom = zoom;
    applyPanelZoom();
    safeStorageSet('agi_panel_zoom', panelZoom);
  }

  function applyPanelZoom() {
    if (!panel) return;
    panel.style.transform = 'scale(' + panelZoom + ')';
    panel.style.transformOrigin = 'top right';
    if (zoomLevelEl) {
      zoomLevelEl.textContent = Math.round(panelZoom * 100) + '%';
    }
  }

    panel.style.display = 'none';
  });

  btnMinimize.addEventListener('click', function() {
    var body = panel.querySelector('.agi-panel-body');
    var isMinimized = body.style.display === 'none';
    if (isMinimized) {
      body.style.display = '';
      panel.style.resize = 'both';
    } else {
      body.style.display = 'none';
      panel.style.resize = 'none';

  btnZoomOut.addEventListener('click', function() { setPanelZoom(panelZoom - 0.1); });

    if (drawMode === 'rect') {
      cancelDrawMode();
    } else {
      startDrawMode('rect');
    }

  polygonPointsInput.addEventListener('change', function() {

    if (val >= 3 && val <= 6) {

  // PDF翻页和缩放事件
  if (btnPdfPrev) btnPdfPrev.addEventListener('click', prevPage);
  if (btnPdfNext) btnPdfNext.addEventListener('click', nextPage);
  if (btnPdfZoomIn) btnPdfZoomIn.addEventListener('click', function() { setPDFScale(pdfScale + 0.25); });
  if (btnPdfZoomOut) btnPdfZoomOut.addEventListener('click', function() { setPDFScale(pdfScale - 0.25); });

  // ========== 拖动功能 ==========
  var isDragging = false;
  var startX, startY, startLeft, startTop;

  header.addEventListener('mousedown', function(e) {
    if (e.target.tagName === 'BUTTON') return;
    isDragging = true;
    panel.classList.add('agi-dragging');
    startX = e.clientX;
    startY = e.clientY;
    var rect = panel.getBoundingClientRect();
    startLeft = rect.left;
    startTop = rect.top;
    e.preventDefault();
  });

  document.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    var newLeft = startLeft + dx;
    var newTop = startTop + dy;

    var maxLeft = window.innerWidth - 60;
    var maxTop = window.innerHeight - 40;
    newLeft = Math.max(-panel.offsetWidth + 60, Math.min(newLeft, maxLeft));
    newTop = Math.max(0, Math.min(newTop, maxTop));

    panel.style.left = newLeft + 'px';
    panel.style.top = newTop + 'px';
    panel.style.right = 'auto';
  });

  document.addEventListener('mouseup', function() {
    if (isDragging) {
      isDragging = false;
      panel.classList.remove('agi-dragging');
    }
    // 结束矩形绘制
    if (drawMode === 'rect' && isDrawing) {
      endRectDraw({});
    }
    // 结束标注框拖拽
    if (isDraggingBox) {
      endDragBox({});
    }
    // 结束标注框缩放
    if (isResizingBox) {
      endResizeBox({});
    }
    // 结束多边形顶点拖拽
    if (isDraggingPolygonVertex) {
      endDragPolygonVertex({});
    }
  });

  document.addEventListener('mousemove', function(e) {
    // 面板拖动（原有）
    if (isDragging) { /* 已在上面处理 */ }
    // 矩形绘制预览
    if (drawMode === 'rect' && isDrawing) {
      moveRectDraw(e);
    }
    // 标注框拖拽
    if (isDraggingBox) {
      dragBox(e);
    }
    // 标注框缩放
    if (isResizingBox) {
      resizeBox(e);
    }
    // 多边形顶点拖拽
    if (isDraggingPolygonVertex) {
      dragPolygonVertex(e);
    }
  });

  // ========== 图片上的鼠标事件（绘制模式） ==========
  imageWrapper.addEventListener('mousedown', function(e) {
    if (drawMode === 'rect') {
      startRectDraw(e);
    }
  });

  imageWrapper.addEventListener('click', function(e) {
    if (drawMode === 'polygon') {
      addPolygonPoint(e);
    }
  });

  imageWrapper.addEventListener('dblclick', function(e) {
    if (drawMode === 'polygon') {
      doubleClickPolygon(e);
    }
  });

  // 阻止图片上的右键菜单（避免干扰绘制）
  imageWrapper.addEventListener('contextmenu', function(e) {
    if (drawMode) {
      e.preventDefault();
    }
  });

  // ========== 处理初始化数据 ==========
  function handleInitData(data) {
    initData = data;
    var value = data.value || data;

    if (typeof value === 'string') {
      try {
        value = JSON.parse(value);
      } catch(e) {
        console.log('[Benchmark V3] 初始化数据解析失败:', e.message);
      }
    }

    // 加载图片
    if (value && value.image_url) {
      loadImage(value.image_url);
    }

    var contents = [];
    if (value && value.contents && Array.isArray(value.contents)) {
      contents = value.contents;
    } else if (Array.isArray(value)) {
      contents = value;
    }

    if (contents.length > 0) {
      boxesData = [];
      contents.forEach(function(item, i) {
        var normalizedItem = normalizeItem(item);
        // 解析attribute字段
        var attr = normalizedItem.attribute || {};
        var box = {
          index: normalizedItem.index !== undefined ? normalizedItem.index : i,
          page: normalizedItem.page !== undefined ? normalizedItem.page : (attr.page !== undefined ? attr.page : 0),
          type: normalizedItem.type || attr.type || 'paragraph',
          location: normalizedItem.location || attr.location || 'main',
          title_level: normalizedItem.title_level !== undefined ? normalizedItem.title_level : (attr.title_level !== undefined ? attr.title_level : -1),
          attach_index: normalizedItem.attach_index !== undefined ? normalizedItem.attach_index : (attr.attach_index !== undefined ? attr.attach_index : -1),
          coords: null,
          description: normalizedItem.text || '',
          text: normalizedItem.text || ''
        };

        if (normalizedItem.position && Array.isArray(normalizedItem.position)) {
          var pos = normalizedItem.position;
          if (pos.length === 4) {
            box.coords = { x1: pos[0], y1: pos[1], x2: pos[2], y2: pos[3] };
          } else if (pos.length >= 6 && pos.length % 2 === 0) {
            var points = [];
            for (var j = 0; j < pos.length; j += 2) {
              points.push({ x: pos[j], y: pos[j+1] });
            }
            if (points.length === 4 && isAxisAlignedRect(points)) {
              var xs = points.map(function(p) { return p.x; });
              var ys = points.map(function(p) { return p.y; });
              box.coords = {
                x1: Math.min.apply(null, xs), y1: Math.min.apply(null, ys),
                x2: Math.max.apply(null, xs), y2: Math.max.apply(null, ys)
              };
            } else {
              box.coords = { points: points };
              box.annotationType = 'POLYGON';
            }
          }
        }

        box._importData = normalizedItem;
        boxesData.push(box);
      });

      fetchedTime = getLocalTimeString();
      renderAnnotationUI();

      if (contents.length > 0) {
        var items = boxList.querySelectorAll('.agi-box-item');
        contents.forEach(function(raw, i) {
          if (i >= items.length) return;
          var item = normalizeItem(raw);
          var el = items[i];

          if (item.index !== undefined) el.querySelector('.agi-field-index').value = item.index;
          if (item.page !== undefined) el.querySelector('.agi-field-page').value = item.page;

          var typeSelect = el.querySelector('.agi-field-type');
          for (var k = 0; k < typeSelect.options.length; k++) {
            if (typeSelect.options[k].value === item.type) {
              typeSelect.selectedIndex = k;
              break;
            }
          }

          var locSelect = el.querySelector('.agi-field-location');
          for (var k2 = 0; k2 < locSelect.options.length; k2++) {
            if (locSelect.options[k2].value === item.location) {
              locSelect.selectedIndex = k2;
              break;
            }
          }

          el.querySelector('.agi-field-title-level').value = item.title_level;
          var attachInput = el.querySelector('.agi-field-attach-index');
          var importedAttachIndex = item.attach_index;
          if (Array.isArray(item.attach_index)) {
            attachInput.value = item.attach_index.join(', ');
          } else {
            attachInput.value = item.attach_index !== undefined ? item.attach_index : -1;
          }

          // 导入 is_truncated 字段（attach_index ≠ -1 时）
          var isTruncatedCheckbox = el.querySelector('.agi-field-is-truncated');
          if (isTruncatedCheckbox && importedAttachIndex !== -1 && importedAttachIndex !== undefined && importedAttachIndex !== null) {
            isTruncatedCheckbox.checked = (item.is_truncated === true);
          }

          if (item.text !== undefined) {
            var ta = el.querySelector('.agi-field-text');
            ta.value = item.text;
            autoResizeTextarea(ta);
            updateIssues(ta, el);
          }
        });
      }

      if (value && value.update_time) {
        fetchedTime = value.update_time;
      }

      updateAttachHighlight();
      // 应用关联组颜色
      applyBoxGroupColors();
      // 导入后更新 is_truncated 可见性
      var allAttachInputs = boxList.querySelectorAll('.agi-field-attach-index');
      allAttachInputs.forEach(function(input) {
        toggleIsTruncatedVisibility(input);
      });
      saveToCache();
    }
  }

  // ========== 窗口大小变化时重新渲染标注框 ==========
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      if (imageEl && !imageEl.classList.contains('agi-hidden')) {
        imageDisplayWidth = imageEl.width;
        imageDisplayHeight = imageEl.height;
        renderAnnotationBoxes();
      }
    }, 200);
  });

  // ========== 本地测试模式 ==========
  function applyLocalData(imageUrlStr, jsonStr) {
    var data = {};
    if (jsonStr) {
      try {
        var parsed = JSON.parse(jsonStr);
        if (Array.isArray(parsed)) {
          data.contents = parsed;
        } else if (parsed && typeof parsed === 'object') {
          var arrayKeys = ['contents', 'items', 'annotations', 'results', 'data'];
          for (var ki = 0; ki < arrayKeys.length; ki++) {
            if (Array.isArray(parsed[arrayKeys[ki]]) && parsed[arrayKeys[ki]].length > 0) {
              data.contents = parsed[arrayKeys[ki]];
              break;
            }
          }
          if (parsed.version) data.version = parsed.version;
          if (parsed.update_time) data.update_time = parsed.update_time;
          if (parsed.image_url) data.image_url = parsed.image_url;
        }
      } catch(e) {
        showStatus('❌ JSON解析失败: ' + e.message, 'error');
        return;
      }
    }

    if (imageUrlStr) data.image_url = imageUrlStr;

    if (data.image_url) {
      loadImage(data.image_url);
    }

    if (data.contents && data.contents.length > 0) {
      handleInitData(data);
    } else if (!data.image_url) {
      showStatus('⚠️ 未找到有效的标注数据', 'error');
    }
  }

  // 检查URL参数
  function checkUrlParams() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('demo') === '1') {
      var demoData = generateDemoData();
      setTimeout(function() {
        applyLocalData(demoData.image_url, JSON.stringify(demoData));
        showStatus('🎯 已加载示例数据', 'info');
      }, 500);
      return true;
    }
    return false;
  }

  // ========== 初始化 ==========
  initPanelZoom();
  restoreFromCache();
  checkUrlParams();

  // ========== 独立版初始化（无平台依赖） ==========
  console.log('[Benchmark V3 标注工具] 已加载完成，版本 V3.2（支持PDF）');

})();
</script>
