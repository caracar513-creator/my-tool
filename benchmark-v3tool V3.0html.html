  }

  function updatePanelCoords(arrayIdx) {
    // 通过data-index属性查找对应的面板项
    var panelItem = boxList.querySelector('.agi-box-item[data-index="' + arrayIdx + '"]');
    if (!panelItem) return;
    var box = boxesData[arrayIdx];
    var position = coordsToPosition(box.coords);
    var coordsEl = panelItem.querySelector('.agi-box-coords');
    if (coordsEl) {
      coordsEl.textContent = position ? '[' + position.join(', ') + ']' : '无坐标';
    }
  }

  // ========== 坐标转换 ==========
  // ========== 多边形顶点排序（从左上角开始，顺时针） ==========
  function sortPolygonPointsClockwiseFromTopLeft(points) {
    if (!points || points.length < 3) return points;
    // 找到最左上角的点（y最小，y相同则x最小）
    var startIdx = 0;
    for (var i = 1; i < points.length; i++) {
      if (points[i].y < points[startIdx].y || (points[i].y === points[startIdx].y && points[i].x < points[startIdx].x)) {
        startIdx = i;
      }
    }
    // 计算每个点相对于起始点的角度（屏幕坐标系y轴向下）
    var startPt = points[startIdx];
    var sorted = points.map(function(p, i) {
      var dx = p.x - startPt.x;
      var dy = p.y - startPt.y;
      // 在屏幕坐标系中，atan2(dy, dx)给出的角度：
      // 0 = 右, 90 = 下, 180/-180 = 左, -90 = 上
      // 要按顺时针从左上角开始排序，需要：左上(-139到-180) -> 右上(0到-45) -> 右下(0到45) -> 左下(45到135) -> 回到左上
      // 实际上，从左上角顺时针的顺序是：左上 -> 右上 -> 右下 -> 左下
      var angle = Math.atan2(dy, dx) * 180 / Math.PI;
      return { point: p, idx: i, angle: angle, dx: dx, dy: dy };
    });

    // 按顺时针方向排序（从左上角开始）
    // 左上角区域的点角度约为 -180 到 -90（或 180 到 270）
    // 右上角区域的点角度约为 -90 到 0
    // 右下角区域的点角度约为 0 到 90
    // 左下角区域的点角度约为 90 到 180
    sorted.sort(function(a, b) {
      // 将角度归一化到 0-360 范围，从左上角开始顺时针
      // 左上角: atan2(-dy, -dx) 约 135-180 或 -180 到 -135
      // 转换：使左上角为起始点（角度最小）
      function normalizeAngle(item) {
        if (item.idx === startIdx) return -1; // 起始点排最前
        var ang = item.angle;
        // 从左上角顺时针：左上(-180~-90) -> 右上(-90~0) -> 右下(0~90) -> 左下(90~180)
        // 我们希望顺序：起始点(左上角) -> 右上 -> 右下 -> 左下 -> 回到起始点
        // 在屏幕坐标系中，从左上角顺时针的角度顺序是：
        // 右上: 角度约 -45 度（右偏上）
        // 右下: 角度约 45 度（右偏下）
        // 左下: 角度约 135 度（左偏下）
        // 所以顺时针顺序对应角度递增（从某个参考点开始）

        // 更简单的方法：使用叉积判断相对位置
        // 从起始点开始，按与水平方向的夹角排序
        // 由于起始点是最左上角，顺时针顺序就是角度从 -180 递增到 180
        if (ang < 0) ang += 360;
        // 但是左上角点的角度范围是 180-270（在标准atan2中）
        // 需要调整使得从左上角顺时针时角度递增
        // 左上角顺时针：左上(角度225左右) -> 右上(角度315/-45) -> 右下(角度45) -> 左下(角度135)
        // 所以归一化后：右上(315) > 右下(45+360=405?) 不对

        // 更直接的方法：根据点相对于起始点的象限
        // 起始点是最左上角
        // 顺时针顺序：右上方点 -> 右下方点 -> 左下方点 -> 左上方点（回到起点）
        // 用叉积和点积来确定顺序
        return ang;
      }
      return normalizeAngle(a) - normalizeAngle(b);
    });

    // 重新实现：使用更可靠的排序方法
    // 从最左上角开始，按顺时针方向排列
    // 方法：计算重心，然后按相对于重心的极角排序（在屏幕坐标系中，顺时针方向对应角度递减）
    var cx = 0, cy = 0;
    points.forEach(function(p) { cx += p.x; cy += p.y; });
    cx /= points.length;
    cy /= points.length;

    var result = points.slice().sort(function(a, b) {
      // 在屏幕坐标系（y向下）中，按相对于重心的角度排序
      // 顺时针方向：角度从正上方开始递减（或递增，取决于方向）
      var angleA = Math.atan2(a.y - cy, a.x - cx);
      var angleB = Math.atan2(b.y - cy, b.x - cx);
      // 屏幕坐标系中，顺时针方向对应角度递减
      return angleB - angleA;
    });

    // 找到最左上角点在排序后数组中的位置
    var topLeftSortedIdx = 0;
    for (var j = 0; j < result.length; j++) {
      if (result[j] === points[startIdx]) {
        topLeftSortedIdx = j;
        break;
      }
    }

    // 重新排列，从最左上角开始
    var final = result.slice(topLeftSortedIdx).concat(result.slice(0, topLeftSortedIdx));
    return final;
  }

  // ========== 坐标转换为position数组 ==========
  function coordsToPosition(coords) {
    if (!coords) return null;

    if (coords.points && Array.isArray(coords.points)) {
      // 多边形：按用户点击的原始顺序输出坐标
      var result = [];
      coords.points.forEach(function(p) {
        result.push(Math.round(p.x));
        result.push(Math.round(p.y));
      });
      return result;
    }

    return [
      Math.round(coords.x1),
      Math.round(coords.y1),
      Math.round(coords.x2),
      Math.round(coords.y1),
      Math.round(coords.x2),
      Math.round(coords.y2),
      Math.round(coords.x1),
      Math.round(coords.y2)
    ];
  }

  // ========== 格式问题检测 ==========
  function detectIssues(text, type) {
    var issues = [];
    if (!text) return issues;

    if (/\*\*[\s\S]+?\*\*/.test(text))
      issues.push({ id: 'bold', level: 'error', msg: '含有加粗格式 **...**' });

    if (/(?<!\*)\*(?!\*)[\s\S]+?\*(?!\*)/.test(text))
      issues.push({ id: 'italic_star', level: 'error', msg: '含有斜体格式 *...*' });

    if (/(?<!\w)_(?![0-9a-zA-Z{\\])[\s\S]+?_(?!\w)/.test(text))
      issues.push({ id: 'italic_under', level: 'error', msg: '含有斜体格式 _..._' });

    if (/~~[\s\S]+?~~/.test(text))
      issues.push({ id: 'strikethrough', level: 'error', msg: '含有删除线格式 ~~...~~' });

    if (type !== 'table' && /<[a-zA-Z][\s\S]*?>/.test(text))
      issues.push({ id: 'html', level: 'error', msg: '含有 HTML 标签' });

    if (/^>\s/m.test(text))
      issues.push({ id: 'blockquote', level: 'error', msg: '含有引用块格式 > ' });

    return issues;
  }

// ========== 自动修复文本 ==========
function autoFixText(text, type) {
    var result = text;
    result = result.replace(/\*\*(.+?)\*\*/g, '$1');
    result = result.replace(/(?<!\*)\*(?!\*)(.+?)\*(?!\*)/g, '$1');
    result = result.replace(/(?<!\w)_(?![0-9a-zA-Z{\\])(.+?)_(?!\w)/g, '$1');
    result = result.replace(/~~(.+?)~~/g, '$1');
    result = result.replace(/^>\s/gm, '');
    return result;
  }

  // ========== 颜色变暗 ==========
  function darkenColor(color, amount) {
    // 支持 #rgb 和 #rrggbb 格式
    var hex = color.replace('#', '');
    if (hex.length === 3) {
      hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    }
    var r = parseInt(hex.substring(0, 2), 16);
    var g = parseInt(hex.substring(2, 4), 16);
    var b = parseInt(hex.substring(4, 6), 16);
    r = Math.max(0, Math.min(255, r - amount));
    g = Math.max(0, Math.min(255, g - amount));
    b = Math.max(0, Math.min(255, b - amount));
    return '#' + 
      (r < 16 ? '0' : '') + r.toString(16) +
      (g < 16 ? '0' : '') + g.toString(16) +
      (b < 16 ? '0' : '') + b.toString(16);
  }

  // ========== 防抖 ==========
  function debounce(fn, delay) {
    var timer;
    return function() {
      var args = arguments;
      var ctx = this;
      clearTimeout(timer);
      timer = setTimeout(function() { fn.apply(ctx, args); }, delay);
    };
  }

  // ========== 复制到剪贴板 ==========
  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        resolve();
      } catch(e) {
        reject(e);
      }
    });
  }

  // ========== 多边形顺时针检测（屏幕坐标系，y轴向下） ==========
  function isClockwise(coords) {
    if (!coords || !coords.points || coords.points.length < 3) return true;
    var points = coords.points;
    var sum = 0;
    for (var i = 0; i < points.length; i++) {
      var p1 = points[i];
      var p2 = points[(i + 1) % points.length];
      sum += (p2.x - p1.x) * (p2.y + p1.y);
    }
    // 屏幕坐标系y轴向下，sum < 0表示顺时针
    return sum < 0;
  }

  // ========== 判断是否为轴对齐矩形 ==========
  function isAxisAlignedRect(points) {
    if (points.length !== 4) return false;
    var xs = points.map(function(p) { return p.x; });
    var ys = points.map(function(p) { return p.y; });
    var uniqueXs = xs.filter(function(v, i, a) { return a.indexOf(v) === i; });
    var uniqueYs = ys.filter(function(v, i, a) { return a.indexOf(v) === i; });
    return uniqueXs.length === 2 && uniqueYs.length === 2;
  }

  // ========== 自适应高度 ==========
  function autoResizeTextarea(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.max(32, ta.scrollHeight) + 'px';
  }

  // ========== 更新问题检测 ==========
  function updateIssues(textArea, boxEl) {
    var typeSelect = boxEl.querySelector('.agi-field-type');
    var type = typeSelect ? typeSelect.value : 'paragraph';
    var text = textArea.value;
    var issues = detectIssues(text, type);
    var badge = boxEl.querySelector('.agi-issue-badge');
    var issuesPanel = boxEl.querySelector('.agi-text-issues');

    var errorCount = issues.filter(function(i) { return i.level === 'error'; }).length;

    if (issues.length === 0) {
      badge.classList.add('agi-hidden');
      badge.title = '';
      issuesPanel.classList.add('agi-hidden');
      issuesPanel.innerHTML = '';
      return;
    }

    badge.classList.remove('agi-hidden');
    if (errorCount > 0) {
      badge.className = 'agi-issue-badge agi-issue-error';
      badge.textContent = '⚠️ ' + errorCount;
      badge.title = errorCount + ' 个格式问题，点击查看';
    } else {
      badge.className = 'agi-issue-badge agi-issue-info';
      badge.textContent = 'ℹ️ ' + issues.length;
      badge.title = issues.length + ' 个提示，点击查看';
    }

    badge.onclick = function() {
      if (issuesPanel.classList.contains('agi-hidden')) {
        renderIssuesPanel(issuesPanel, issues, textArea, boxEl);
        issuesPanel.classList.remove('agi-hidden');
      } else {
        issuesPanel.classList.add('agi-hidden');
      }
    };
  }

  // ========== 渲染问题面板 ==========
  function renderIssuesPanel(panel, issues, textArea, boxEl) {
    var html = '';
    var hasFixable = issues.some(function(i) { return i.level === 'error'; });

    if (hasFixable) {
      html += '<div class="agi-issues-actions">' +
        '<button class="agi-btn agi-btn-sm agi-btn-fix-all">🔧 一键修复</button>' +
        '<button class="agi-btn agi-btn-sm agi-btn-undo agi-hidden">↩️ 撤销</button>' +
      '</div>';
    }

    issues.forEach(function(issue) {
      var icon = issue.level === 'error' ? '❌' : 'ℹ️';
      var cls = issue.level === 'error' ? 'agi-issue-item-error' : 'agi-issue-item-info';
      html += '<div class="agi-issue-item ' + cls + '">' + icon + ' ' + escapeHtml(issue.msg) + '</div>';
    });

    panel.innerHTML = html;

    var btnFix = panel.querySelector('.agi-btn-fix-all');
    var btnUndo = panel.querySelector('.agi-btn-undo');
    if (btnFix) {
      btnFix.addEventListener('click', function() {
        var typeSelect = boxEl.querySelector('.agi-field-type');
        var type = typeSelect ? typeSelect.value : 'paragraph';
        var oldText = textArea.value;
        var newText = autoFixText(oldText, type);
        if (newText !== oldText) {
          textArea.value = newText;
          autoResizeTextarea(textArea);
          saveToCache();
          btnUndo.classList.remove('agi-hidden');
          btnUndo._undoText = oldText;
          btnFix.textContent = '✅ 已修复';
          btnFix.disabled = true;
          updateIssues(textArea, boxEl);
        }
      });
    }
    if (btnUndo) {
      btnUndo.addEventListener('click', function() {
        if (btnUndo._undoText !== undefined) {
          textArea.value = btnUndo._undoText;
          autoResizeTextarea(textArea);
          saveToCache();
          btnUndo.classList.add('agi-hidden');
          var fixBtn = panel.querySelector('.agi-btn-fix-all');
          if (fixBtn) {
            fixBtn.textContent = '🔧 一键修复';
            fixBtn.disabled = false;
          }
          updateIssues(textArea, boxEl);
        }
      });
    }
  }

  // ========== 渲染预览 ==========
  // 通过 KaTeX 渲染公式（同步）
  function requestKatexRender(formulas) {
    if (!window.katex) {
      console.log('[Benchmark V3] KaTeX 未加载');
      return null;
    }
    try {
      var rendered = formulas.map(function(f) {
        try {
          return katex.renderToString(f.latex, {
            displayMode: f.displayMode,
            throwOnError: false
          });
        } catch(e) {
          console.log('[Benchmark V3] KaTeX 渲染错误:', e.message);
          return null;
        }
      });
      return rendered;
    } catch(e) {
      console.log('[Benchmark V3] KaTeX 渲染失败:', e.message);
      return null;
    }
  }

  function renderTextPreview(text, type) {
    // 0. 将字面 \n / \t 还原为真实换行/制表符，以便正确渲染
    //    \t 仅豁免常见 LaTeX 命令前缀（\text \theta \tan \times \tau），其余 \t 均还原为制表符
    var processed = text.replace(/\\n/g, '\n').replace(/\\t(?!(?:ext|het|an|imes|au))/g, '\t');
    
    // 1. 提取所有公式：\[...\] 块级 和 \(...\) 行内 和 $$...$$ 块级 和 $...$ 行内
    var formulas = [];     // { latex, displayMode, placeholder, original }
    var idx = 0;

    // 块级公式 \[...\]（可能跨行）
    processed = processed.replace(/\\\[([\s\S]*?)\\\]/g, function(m, inner) {
      var ph = '\x00FORMULA_' + idx + '\x00';
      formulas.push({ latex: inner.trim(), displayMode: true, placeholder: ph, original: m });
      idx++;
      return ph;
    });

    // 块级公式 $$...$$（可能跨行，先于 $ 单美元符号处理）
    processed = processed.replace(/\$\$([\s\S]+?)\$\$/g, function(m, inner) {
      var ph = '\x00FORMULA_' + idx + '\x00';
      formulas.push({ latex: inner.trim(), displayMode: true, placeholder: ph, original: m });
      idx++;
      return ph;
    });

    // 行内公式 \(...\)（可能含嵌套括号）
    processed = processed.replace(/\\\(([\s\S]*?)\\\)/g, function(m, inner) {
      var ph = '\x00FORMULA_' + idx + '\x00';
      formulas.push({ latex: inner.trim(), displayMode: false, placeholder: ph, original: m });
      idx++;
      return ph;
    });

    // 行内公式 $...$（单个美元符号，不含换行，排除已被 $$ 匹配的）
    processed = processed.replace(/(?<!\$)\$(?!\$)([^\$\n]+?)\$(?!\$)/g, function(m, inner) {
      var ph = '\x00FORMULA_' + idx + '\x00';
      formulas.push({ latex: inner.trim(), displayMode: false, placeholder: ph, original: m });
      idx++;
      return ph;
    });

    // 2. 通过 KaTeX 渲染所有公式
    var renderedFormulas = null;
    if (formulas.length > 0) {
      renderedFormulas = requestKatexRender(formulas);
    }

    // 3. 构建最终 HTML
    var html;
    if (type === 'table') {
      html = processed;
    } else {
      html = escapeHtml(processed);
      html = html.replace(/\n/g, '<br>');
      html = html.replace(/(\t+)/g, function(m) {
        var count = m.length;
        return '<span style="display:inline-block;text-align:center;min-width:' + (count * 4) + 'ch;background:rgba(255,165,0,0.2);border-radius:3px;color:#b8860b;font-size:0.85em;">L' + count + '</span>';
      });
    }

    // 4. 替换占位符为渲染结果
    for (var i = 0; i < formulas.length; i++) {
      var f = formulas[i];
      var rendered;
      if (renderedFormulas && renderedFormulas[i]) {
        rendered = renderedFormulas[i];
      } else {
        // KaTeX 不可用，降级为蓝色高亮显示原始公式源码（保留原始定界符）
        var escapedOriginal = escapeHtml(f.original);
        if (f.displayMode) {
          rendered = '<div class="agi-formula-block">' + escapedOriginal + '</div>';
        } else {
          rendered = '<span class="agi-formula-inline">' + escapedOriginal + '</span>';
        }
      }
      // 在非 table 模式下占位符也被 escapeHtml 了，需要匹配转义后的形式
      var phEscaped = escapeHtml(f.placeholder);
      html = html.split(phEscaped).join(rendered);
      html = html.split(f.placeholder).join(rendered);
    }

    var cls = type === 'table' ? 'agi-render-content agi-render-table' : 'agi-render-content';
    return '<div class="' + cls + '">' + html + '</div>';
  }

  // ========== 刷新已展开的渲染 ==========
  function refreshOpenRender(boxEl, textArea) {
    var renderDiv = boxEl.querySelector('.agi-text-render');
    if (!renderDiv || renderDiv.classList.contains('agi-hidden')) return;
    
    var typeSelect = boxEl.querySelector('.agi-field-type');
    var type = typeSelect ? typeSelect.value : 'paragraph';
    renderDiv.innerHTML = renderTextPreview(textArea.value, type);
  }

  // ========== 渲染图片上的标注框 ==========
  function renderAnnotationBoxes() {
    // 清除旧的标注框
    var oldBoxes = imageWrapper.querySelectorAll('.agi-annotation-box');
    for (var i = 0; i < oldBoxes.length; i++) {
      oldBoxes[i].parentNode.removeChild(oldBoxes[i]);
    }

    if (!imageNaturalWidth || !imageNaturalHeight || !imageDisplayWidth || !imageDisplayHeight) {
      return;
    }

    var scaleX = imageDisplayWidth / imageNaturalWidth;
    var scaleY = imageDisplayHeight / imageNaturalHeight;

    boxesData.forEach(function(box, idx) {
      if (!box.coords) return;

      // PDF模式下，只渲染当前页的标注框（page 从 0 开始，pdfCurrentPage 从 1 开始）
      // 使用 parseInt 确保类型一致，避免字符串 vs 数字比较失败
      if (currentContentType === 'pdf' && box.page !== undefined && box.page !== null && box.page !== '' && parseInt(box.page) !== (pdfCurrentPage - 1)) {
        return;
      }

      var left, top, width, height;
      var isPolygon = box.annotationType === 'POLYGON';

      if (isPolygon && box.coords.points) {
        // 多边形：使用points计算包围盒
        var points = box.coords.points;
        var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (var i = 0; i < points.length; i++) {
          if (points[i].x < minX) minX = points[i].x;
          if (points[i].y < minY) minY = points[i].y;
          if (points[i].x > maxX) maxX = points[i].x;
          if (points[i].y > maxY) maxY = points[i].y;
        }
        left = minX * scaleX;
        top = minY * scaleY;
        width = (maxX - minX) * scaleX;
        height = (maxY - minY) * scaleY;
      } else if (box.coords.x1 !== undefined) {
        // 矩形
        var x1 = box.coords.x1;
        var y1 = box.coords.y1;
        var x2 = box.coords.x2;
        var y2 = box.coords.y2;
        left = Math.min(x1, x2) * scaleX;
        top = Math.min(y1, y2) * scaleY;
        width = Math.abs(x2 - x1) * scaleX;
        height = Math.abs(y2 - y1) * scaleY;
      } else {
        return;
      }

      var boxEl = document.createElement('div');
      boxEl.className = 'agi-annotation-box';
      boxEl.style.left = left + 'px';
      boxEl.style.top = top + 'px';
      boxEl.style.width = width + 'px';
      boxEl.style.height = height + 'px';
      boxEl.dataset.index = idx;
      boxEl.dataset.boxIndex = box.index;

      if (isPolygon && box.coords.points) {
        // 多边形：不显示默认边框，只画实际边线和顶点（可拖拽）
        boxEl.style.border = 'none';
        boxEl.style.background = 'transparent';
        var pts = box.coords.points;
        for (var pIdx = 0; pIdx < pts.length; pIdx++) {
          var pt = pts[pIdx];
          var dX = pt.x * scaleX;
          var dY = pt.y * scaleY;
          // 顶点圆圈（可拖拽）
          var pointEl = document.createElement('div');
          pointEl.className = 'agi-annotation-polygon-point';
          pointEl.style.left = (dX - left - 4) + 'px';
          pointEl.style.top = (dY - top - 4) + 'px';
          pointEl.style.cursor = 'move';
          pointEl.dataset.pointIndex = pIdx;
          pointEl.dataset.boxIndex = idx;
          // 添加拖拽事件
          (function(boxIdx, pointIdx, pointEl) {
            pointEl.addEventListener('mousedown', function(e) {
              e.preventDefault();
              e.stopPropagation();
              startDragPolygonVertex(e, boxIdx, pointIdx);
            });
          })(idx, pIdx, pointEl);
          boxEl.appendChild(pointEl);
          // 边线
          var nextPt = pts[(pIdx + 1) % pts.length];
          var nX = nextPt.x * scaleX;
          var nY = nextPt.y * scaleY;
          var len = Math.sqrt(Math.pow(nX - dX, 2) + Math.pow(nY - dY, 2));
          var ang = Math.atan2(nY - dY, nX - dX) * 180 / Math.PI;
          var lineEl = document.createElement('div');
          lineEl.className = 'agi-annotation-polygon-line';
          lineEl.style.left = (dX - left) + 'px';
          lineEl.style.top = (dY - top) + 'px';
          lineEl.style.width = len + 'px';
          lineEl.style.transform = 'rotate(' + ang + 'deg)';
          boxEl.appendChild(lineEl);
        }
      }

      // 序号标签
      var label = document.createElement('span');
      label.className = 'agi-box-label';
      label.textContent = box.index;
      boxEl.appendChild(label);

      // 悬浮属性提示（紧邻index）
      var tooltip = document.createElement('div');
      tooltip.className = 'agi-box-tooltip';
      var typeText = box.type || '';
      var locText = box.location || '';
      var tooltipHtml = '<span class="agi-tt-type">' + typeText + '</span>' +
        ' <span class="agi-tt-loc">' + locText + '</span>';
      if (box.type === 'title' && box.title_level !== undefined && box.title_level !== null && box.title_level !== '') {
        tooltipHtml += ' <span class="agi-tt-title-level">L' + box.title_level + '</span>';
      }
      tooltip.innerHTML = tooltipHtml;
      boxEl.appendChild(tooltip);

      // 删除按钮
      var deleteBtn = document.createElement('div');
      deleteBtn.className = 'agi-box-delete-btn';
      deleteBtn.innerHTML = '×';
      deleteBtn.title = '删除此标注框';
      deleteBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        deleteBox(idx);
      });
      boxEl.appendChild(deleteBtn);

      // 矩形框：隐形边缘/角落缩放区（替代可见缩放手柄）
      if (box.annotationType !== 'POLYGON') {
        boxEl.addEventListener('mousemove', function(e) {
          if (isResizingBox || isDraggingBox) return;
          var rect = boxEl.getBoundingClientRect();
          var mx = e.clientX - rect.left;
          var my = e.clientY - rect.top;
          var w = rect.width;
          var h = rect.height;
          var zone = getZoneSize(w, h);
          var cursor = 'move';
          if (mx < zone && my < zone) cursor = 'nw-resize';
          else if (mx > w - zone && my < zone) cursor = 'ne-resize';
          else if (mx < zone && my > h - zone) cursor = 'sw-resize';
          else if (mx > w - zone && my > h - zone) cursor = 'se-resize';
          else if (my < zone) cursor = 'n-resize';
          else if (my > h - zone) cursor = 's-resize';
          else if (mx < zone) cursor = 'w-resize';
          else if (mx > w - zone) cursor = 'e-resize';
          boxEl.style.cursor = cursor;
        });
        boxEl.addEventListener('mouseleave', function(e) {
          if (!isResizingBox && !isDraggingBox) {
            boxEl.style.cursor = 'move';
          }
        });
      }

      // 点击事件：跳转到对应的标注项
      boxEl.addEventListener('click', function(e) {
        if (e.target.classList.contains('agi-box-delete-btn')) return;
        e.stopPropagation();
        // 获取该标注框的page，如果与面板当前页不同，先切换面板页
        var boxPage = parseInt(boxesData[idx].page);
        if (isNaN(boxPage)) boxPage = 0;
        if (boxPage !== panelCurrentPage) {
          panelCurrentPage = boxPage;
          renderAnnotationUI();
        }
        jumpToAnnotationItem(idx);
      });

      // 拖拽移动 / 缩放的mousedown路由
      boxEl.addEventListener('mousedown', function(e) {
        if (e.target.classList.contains('agi-box-delete-btn')) return;
        // 多边形框只支持整体拖动
        if (boxesData[idx] && boxesData[idx].annotationType === 'POLYGON') {
          startDragBox(e, idx);
          return;
        }
        var rect = boxEl.getBoundingClientRect();
        var mx = e.clientX - rect.left;
        var my = e.clientY - rect.top;
        var w = rect.width;
        var h = rect.height;
        var zone = getZoneSize(w, h);
        var handle = null;
        if (mx < zone && my < zone) handle = 'nw';
        else if (mx > w - zone && my < zone) handle = 'ne';
        else if (mx < zone && my > h - zone) handle = 'sw';
        else if (mx > w - zone && my > h - zone) handle = 'se';
        else if (my < zone) handle = 'n';
        else if (my > h - zone) handle = 's';
        else if (mx < zone) handle = 'w';
        else if (mx > w - zone) handle = 'e';
        if (handle) {
          startResizeBox(e, idx, handle);
        } else {
          startDragBox(e, idx);
        }
      });

      imageWrapper.appendChild(boxEl);
    });

    // 应用关联组颜色
    applyBoxGroupColors();
  }

  // ========== 应用关联组颜色到标注框 ==========
  function applyBoxGroupColors() {
    var groupMap = computeAttachGroups(); // V3.9: groupMap 的 key 为 arrayIdx
    var boxEls = imageWrapper.querySelectorAll('.agi-annotation-box');
    var items = boxList.querySelectorAll('.agi-box-item');

    // 应用到面板中的box item（背景和左边框）
    items.forEach(function(item) {
      var arrayIdx = parseInt(item.dataset.index);
      // V3.9: 直接使用 arrayIdx 查找颜色
      var color = groupMap[arrayIdx];

        item.style.background = color + '20'; // 20% 透明度
        item.style.borderLeft = '3px solid ' + color;

        item.style.borderLeft = '3px solid transparent';

  // ========== 跳转到标注项（双向联动） ==========
  function jumpToAnnotationItem(arrayIdx, fromPanel) {
    // 移除所有active状态
    var allBoxes = imageWrapper.querySelectorAll('.agi-annotation-box');
    for (var i = 0; i < allBoxes.length; i++) {
      allBoxes[i].classList.remove('agi-active');
    }
    
    // 移除所有面板项的active状态
    var allItems = boxList.querySelectorAll('.agi-box-item');
    for (var i = 0; i < allItems.length; i++) {
      allItems[i].classList.remove('agi-item-active');
    }
    
    // 添加active状态到图片上的标注框
    var targetBox = imageWrapper.querySelector('.agi-annotation-box[data-index="' + arrayIdx + '"]');
    if (targetBox) {
      targetBox.classList.add('agi-active');
      // 如果从面板点击，滚动图片区域到对应标注框
      if (fromPanel) {
        var container = document.getElementById('agi-image-container');
        var boxRect = targetBox.getBoundingClientRect();
        var containerRect = container.getBoundingClientRect();
        container.scrollTo({
          top: container.scrollTop + boxRect.top - containerRect.top - containerRect.height / 2 + boxRect.height / 2,
          left: container.scrollLeft + boxRect.left - containerRect.left - containerRect.width / 2 + boxRect.width / 2,
          behavior: 'smooth'
        });
      }
    }

    // 滚动面板到对应的标注项并高亮（通过data-index查找面板项）
    var targetPanelItem = boxList.querySelector('.agi-box-item[data-index="' + arrayIdx + '"]');

  // ========== 从面板点击跳转到图片标注框 ==========
  function jumpToImageBox(arrayIdx) {
    // 如果是PDF模式，检查是否需要翻页
    if (currentContentType === 'pdf') {
      var boxPage = parseInt(boxesData[arrayIdx].page);
      if (isNaN(boxPage)) boxPage = 0;

  // ========== 计算关联组 ==========
  // V3.9: 基于全局 boxesData，使用 attach_page + attach_index 匹配目标block
  function computeAttachGroups() {
    // V3.9: 建立全局 page_index -> arrayIdx 映射
    var pageIndexToArrayIdx = {};
    for (var i = 0; i < boxesData.length; i++) {
      var box = boxesData[i];
      var bPage = parseInt(box.page);
      var bIndex = parseInt(box.index);
      if (isNaN(bPage)) bPage = 0;
      if (isNaN(bIndex)) bIndex = 0;
      pageIndexToArrayIdx[bPage + '_' + bIndex] = i;
    }

    // V3.9: 并查集，key 为 arrayIdx
    var parent = {};
    function find(x) {
      if (parent[x] === undefined) parent[x] = x;
      if (parent[x] !== x) parent[x] = find(parent[x]);
      return parent[x];
    }
    function union(a, b) {
      var ra = find(a), rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    }

    // V3.9: 遍历所有 boxesData，根据 attach_page + attach_index 建立关联
    for (var i = 0; i < boxesData.length; i++) {
      var box = boxesData[i];
      // V3.9: boxesData 中 attach_index 和 attach_page 直接存储在 box 对象上
      var attachIndex = box.attach_index;
      var attachPage = box.attach_page;

      // V3.9: 跳过无效的 attach 信息
      if (attachIndex === null || attachIndex === undefined || attachIndex === -1 || attachIndex === '-1') continue;
      if (attachPage === null || attachPage === undefined || attachPage === -1 || attachPage === '-1' || attachPage === '') continue;

      var attachIndices = (Array.isArray(attachIndex)) ? attachIndex : [parseInt(attachIndex)];
      var attachPageNum = parseInt(attachPage);
      if (isNaN(attachPageNum)) continue;

      for (var j = 0; j < attachIndices.length; j++) {
        var targetIdx = parseInt(attachIndices[j]);
        if (isNaN(targetIdx)) continue;
        var targetKey = attachPageNum + '_' + targetIdx;
        var targetArrayIdx = pageIndexToArrayIdx[targetKey];
        if (targetArrayIdx !== undefined) {
          union(i, targetArrayIdx);
        }
      }
    }

    // V3.9: 按组收集成员
    var groups = {};
    for (var i = 0; i < boxesData.length; i++) {
      if (parent[i] === undefined) continue;
      var root = find(i);
      if (!groups[root]) groups[root] = [];
      groups[root].push(i);
    }

    // V3.9: 分配颜色，返回 arrayIdx -> color 映射
    var groupMap = {}; // arrayIdx -> color
    var colorIdx = 0;
    Object.keys(groups).forEach(function(root) {
      var members = groups[root];
      if (members.length >= 2) {
        var color = ATTACH_COLORS[colorIdx % ATTACH_COLORS.length];
        colorIdx++;
        members.forEach(function(arrayIdx) {
          groupMap[arrayIdx] = color;
        });
      }
    });

    return groupMap;
  }

  // ========== is_truncated 显示/隐藏控制 ==========
  // V3.9: 根据 attach_index 和 attach_page 的值控制 is_truncated 显示
  function toggleIsTruncatedVisibility(attachInput) {
    var boxItem = attachInput.closest('.agi-box-item');
    if (!boxItem) return;
    var isTruncatedLabel = boxItem.querySelector('.agi-is-truncated-label');
    var attachIndexInput = boxItem.querySelector('.agi-field-attach-index');
    var attachPageInput = boxItem.querySelector('.agi-field-attach-page');
    if (!isTruncatedLabel || !attachIndexInput) return;

    var indexRaw = attachIndexInput.value.trim();
    var indexVal = parseInt(indexRaw);
    var pageRaw = attachPageInput ? attachPageInput.value.trim() : '-1';
    var pageVal = parseInt(pageRaw);

    // attach_index = -1 或 attach_page = -1：隐藏 is_truncated，自动同步 attach_page
    if (indexRaw === '-1' || indexRaw === '' || isNaN(indexVal) || indexVal === -1) {
      // attach_index = -1：自动填充 attach_page = -1，隐藏 is_truncated
      isTruncatedLabel.classList.add('agi-hidden');
      if (attachPageInput) attachPageInput.value = '-1';
    } else if (pageRaw === '-1' || pageRaw === '' || isNaN(pageVal) || pageVal === -1) {
      // attach_index ≠ -1 但 attach_page = -1：无效状态，隐藏 is_truncated
      isTruncatedLabel.classList.add('agi-hidden');
    } else {
      // attach_index ≠ -1 且 attach_page ≠ -1：显示 is_truncated 选框
      isTruncatedLabel.classList.remove('agi-hidden');
    }
  }

  // ========== attach_index 关联显示 ==========
  // V3.9: 支持跨页关联显示和跳转
  function updateAttachHighlight() {
    var items = boxList.querySelectorAll('.agi-box-item');
    var info = collectAttachRelations();
    var relations = info.relations;
    var itemByIndex = info.itemByIndex;
    console.log('[V3.9] updateAttachHighlight: items=' + items.length + ', relations=' + JSON.stringify(relations));

    items.forEach(function(item) {
      var fieldIndex = parseInt(item.querySelector('.agi-field-index').value);
      var arrayIdx = parseInt(item.dataset.index);
      var badgeContainer = item.querySelector('.agi-attach-badge');
      if (!badgeContainer) {
        console.log('[V3.9] badgeContainer not found for arrayIdx=' + arrayIdx);
        return;
      }
      badgeContainer.innerHTML = '';

      // V3.9: 获取当前 block 的 forward 关联（包含 attach_page 信息）
      var forward = [];
      if (relations[arrayIdx]) {
        forward = relations[arrayIdx].filter(function(r) {
          return !(r.page === panelCurrentPage && r.index === fieldIndex); // 过滤自身
        });
      }

      // V3.9: 计算 backward 关联（哪些 block 关联了当前 block）
      var backward = [];
      Object.keys(relations).forEach(function(fromArrayIdx) {
        var fromIdx = parseInt(fromArrayIdx);
        if (isNaN(fromIdx) || fromIdx === arrayIdx) return;
        var rels = relations[fromIdx] || [];
        for (var i = 0; i < rels.length; i++) {
          if (rels[i].page === panelCurrentPage && rels[i].index === fieldIndex) {
            backward.push({ arrayIdx: fromIdx, page: boxesData[fromIdx] ? boxesData[fromIdx].page : 0, index: boxesData[fromIdx] ? boxesData[fromIdx].index : 0 });
            break;
          }
        }
      });

      console.log('[V3.9] arrayIdx=' + arrayIdx + ', forward=' + JSON.stringify(forward) + ', backward=' + JSON.stringify(backward));

      // V3.9: 渲染 forward 徽章（→）
      forward.forEach(function(r) {
        var badge = document.createElement('span');
        badge.className = 'agi-attach-badge-item';
        // V3.9: 显示 page:index 格式
        badge.textContent = '→' + r.page + ':' + r.index;
        badge.style.cursor = 'pointer';
        // V3.9: 存储目标信息
        badge.dataset.targetPage = r.page;
        badge.dataset.targetIndex = r.index;
        badge.addEventListener('click', function(e) {
          e.stopPropagation();
          console.log('[V3.9] forward arrow clicked: page=' + r.page + ', index=' + r.index);
          jumpAndFlashByPageAndIndex(r.page, r.index);
        });
        badgeContainer.appendChild(badge);
      });

      // V3.9: 渲染 backward 徽章（←）
      backward.forEach(function(b) {
        var badge = document.createElement('span');
        badge.className = 'agi-attach-badge-item';
        badge.style.background = '#9254de';
        // V3.9: 显示 page:index 格式
        badge.textContent = '←' + b.page + ':' + b.index;
        badge.style.cursor = 'pointer';
        // V3.9: 存储目标信息
        badge.dataset.targetPage = b.page;
        badge.dataset.targetIndex = b.index;
        badge.addEventListener('click', function(e) {
          e.stopPropagation();
          console.log('[V3.9] backward arrow clicked: page=' + b.page + ', index=' + b.index);
          jumpAndFlashByPageAndIndex(b.page, b.index);
        });
        badgeContainer.appendChild(badge);
      });
    });
  }

  // V3.9: 收集关联关系，返回 arrayIdx -> [{page, index}] 格式
  // V4.4: 基于全局 boxesData 收集关联，修复跨页 backward 关联不显示的问题
  function collectAttachRelations() {
    var relations = {}; // arrayIdx -> [{page, index}]
    var itemByIndex = {}; // 保持兼容性（V4.4 不再从 DOM 读取）
    var arrayIdxByIndex = {}; // 保持兼容性
    boxesData.forEach(function(box, arrayIdx) {
      var attachIndex = box.attach_index;
      var attachPage = box.attach_page;
      // V3.9: 跳过无效的 attach 信息
      if (attachIndex === null || attachIndex === undefined || attachIndex === -1 || attachIndex === '-1') return;
      if (attachPage === null || attachPage === undefined || attachPage === -1 || attachPage === '-1' || attachPage === '') return;
      var attachIndices = (Array.isArray(attachIndex)) ? attachIndex.map(function(v) { return parseInt(v); }) : [parseInt(attachIndex)];
      var attachPageNum = parseInt(attachPage);
      if (isNaN(attachPageNum)) return;
      relations[arrayIdx] = attachIndices.map(function(idx) {
        return { page: attachPageNum, index: idx };
      });
    });
    return { relations: relations, itemByIndex: itemByIndex, arrayIdxByIndex: arrayIdxByIndex };
  }

  function parseAttachValues(str) {
    if (!str || str === '-1' || str.trim() === '') return [];
    return str.split(',').map(function(s) { return parseInt(s.trim()); }).filter(function(n) { return !isNaN(n) && n !== -1; });
  }

  // V3.9: 根据 page 和 index 切换页面并跳转到目标标注框
  function jumpAndFlashByPageAndIndex(targetPage, targetIndex) {
    console.log('[V3.9] jumpAndFlashByPageAndIndex: targetPage=' + targetPage + ', targetIndex=' + targetIndex);
    // V3.9: 如果目标在不同页，先切换页面
    if (targetPage !== panelCurrentPage) {
      panelCurrentPage = targetPage;
      renderAnnotationUI();
      // 延迟执行跳转，等待页面渲染完成
      setTimeout(function() {
        jumpAndFlashWithinPage(targetIndex);
      }, 100);
    } else {
      jumpAndFlashWithinPage(targetIndex);
    }
  }

  // V3.9: 在当前页面内跳转到指定 index 的标注框
  function jumpAndFlashWithinPage(targetIndex) {
    console.log('[V3.9] jumpAndFlashWithinPage: targetIndex=' + targetIndex);
    var target = null;
    var items = boxList.querySelectorAll('.agi-box-item');
    items.forEach(function(item) {
      var idxVal = parseInt(item.querySelector('.agi-field-index').value);
      if (idxVal === targetIndex) {
        target = item;
      }
    });
    if (!target) {
      console.log('[V3.9] target NOT FOUND on current page');
      return;
    }
    console.log('[V3.9] scrolling to target');
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    target.classList.add('agi-group-highlight');
    setTimeout(function() { target.classList.remove('agi-group-highlight'); }, 2000);
  }

  // ========== 渲染标注UI ==========
  function renderAnnotationUI() {
    annotationArea.classList.remove('agi-hidden');
    emptyState.style.display = 'none';

    // FIX: 清除DOM前，先将当前所有输入框的值保存到boxesData（确保切换页面时不丢失修改）
    boxList.querySelectorAll('.agi-box-item').forEach(function(boxItem) {
      var arrayIdx = parseInt(boxItem.dataset.index);
      if (isNaN(arrayIdx) || !boxesData[arrayIdx]) return;
      var box = boxesData[arrayIdx];
      var inputs = boxItem.querySelectorAll('input, select, textarea');
      inputs.forEach(function(el) {
        if (el.classList.contains('agi-field-index')) box.index = el.value === '' ? '' : (parseInt(el.value) || 0);
        else if (el.classList.contains('agi-field-page')) box.page = el.value === '' ? '' : (parseInt(el.value) || 0);
        else if (el.classList.contains('agi-field-type')) box.type = el.value;
        else if (el.classList.contains('agi-field-location')) box.location = el.value;
        else if (el.classList.contains('agi-field-title-level')) { var _tl = parseInt(el.value); box.title_level = el.value === '' ? '' : (isNaN(_tl) ? -1 : _tl); }
        else if (el.classList.contains('agi-field-attach-index')) box.attach_index = el.value;
        else if (el.classList.contains('agi-field-attach-page')) box.attach_page = el.value;
        else if (el.classList.contains('agi-field-text')) { box.description = el.value; box.text = el.value; }
        else if (el.classList.contains('agi-field-is-truncated')) { box.is_truncated = el.checked; }
      });
    });

    boxList.innerHTML = '';

    // 按 page + index 排序（page 优先，然后 index）
    var sortedBoxes = boxesData.map(function(box, idx) { return { box: box, idx: idx }; });
    sortedBoxes.sort(function(a, b) {
      var pageA = parseInt(a.box.page);
      var pageB = parseInt(b.box.page);
      var idxA = parseInt(a.box.index);
      var idxB = parseInt(b.box.index);
      // 处理 NaN 情况
      if (isNaN(pageA)) pageA = 0;
      if (isNaN(pageB)) pageB = 0;
      if (isNaN(idxA)) idxA = 0;
      if (isNaN(idxB)) idxB = 0;
      // 先按 page 排序，page 相同再按 index 排序
      if (pageA !== pageB) return pageA - pageB;
      return idxA - idxB;
    });

    // 提取所有不同的page值并排序，用于分页
    var allPages = [];
    sortedBoxes.forEach(function(entry) {
      var p = parseInt(entry.box.page);
      if (isNaN(p)) p = 0;
      if (allPages.indexOf(p) === -1) allPages.push(p);
    });
    allPages.sort(function(a, b) { return a - b; });

    // FIX: 确保panelCurrentPage是数字类型，避免类型比较问题
    panelCurrentPage = parseInt(panelCurrentPage);
    if (isNaN(panelCurrentPage)) panelCurrentPage = 0;
    
    // 如果当前页超出范围，重置为第一页
    if (allPages.length > 0 && allPages.indexOf(panelCurrentPage) === -1) {
      panelCurrentPage = allPages[0];
    }

    // 只渲染当前页的box
    var currentPageBoxes = sortedBoxes.filter(function(entry) {
      var p = parseInt(entry.box.page);
      if (isNaN(p)) p = 0;
      return p === panelCurrentPage;
    });

    currentPageBoxes.forEach(function(entry) {
      var box = entry.box;
      var idx = entry.idx;
      var position = coordsToPosition(box.coords);
      var positionStr = position ? '[' + position.join(', ') + ']' : '无坐标';

      var typeLabel = '拉框';
      var isPolygon = box.annotationType === 'POLYGON' ||
        (box.coords && box.coords.points && box.coords.points.length > 4);
      if (isPolygon) {
        typeLabel = '多边形';
      }

      var cwWarning = '';
      if (isPolygon && box.coords && box.coords.points && box.coords.points.length >= 3) {
        var cw = isClockwise(box.coords);
        console.log('Debug: isPolygon=' + isPolygon + ', points=' + box.coords.points.length + ', isClockwise=' + cw);
        if (!cw) {
          cwWarning = ' <span class="agi-warn-badge" title="⚠️ 多边形未按顺时针方向标注">⚠️ 非顺时针</span>';
        }
      }

      var boxEl = document.createElement('div');
      boxEl.className = 'agi-box-item';
      boxEl.dataset.index = idx;
      boxEl.dataset.boxIndex = box.index;

      // 从boxesData中读取所有字段值，空值保持为空（不设置默认值）
      var fieldPage = (box.page !== undefined && box.page !== null) ? box.page : '';
      var fieldType = box.type || '';
      var fieldLocation = box.location || '';
      var fieldTitleLevel = (box.title_level !== undefined && box.title_level !== null) ? box.title_level : '';
      var fieldText = box.description || box.text || '';
      // V3.9: 读取 attach_index 和 attach_page，默认为 -1
      var fieldAttachIndex = (box.attach_index !== undefined && box.attach_index !== null) ? box.attach_index : '-1';
      var fieldAttachPage = (box.attach_page !== undefined && box.attach_page !== null) ? box.attach_page : '-1';
      // V4.4: 读取 is_truncated 勾选状态
      var fieldIsTruncated = (box.is_truncated === true);

      // 生成type选项，设置selected（空值时显示空选项）
      var typeOptionsHtml = '';
      if (!fieldType) {
        typeOptionsHtml += '<option value="" selected disabled>请选择</option>';
      }
      typeOptionsHtml += TYPE_OPTIONS.map(function(t) {
        var selected = (t === fieldType) ? ' selected' : '';
        return '<option value="' + t + '"' + selected + '>' + t + '</option>';
      }).join('');

      // 生成location选项，设置selected（空值时显示空选项）
      var locationOptionsHtml = '';
      if (!fieldLocation) {
        locationOptionsHtml += '<option value="" selected disabled>请选择</option>';
      }
      locationOptionsHtml += LOCATION_OPTIONS.map(function(l) {
        var selected = (l === fieldLocation) ? ' selected' : '';
        return '<option value="' + l + '"' + selected + '>' + l + '</option>';

function clearFieldErrors() {

  errorFields.forEach(function(field) {

// ========== 验证必填字段 ==========
function validateRequiredFields() {
  clearFieldErrors();
  var errorMessages = [];
  var firstErrorArrayIdx = -1;
  var firstErrorField = '';

  // 遍历boxesData验证所有页的数据
  boxesData.forEach(function(box, idx) {
    var itemLabel = 'index=' + (box.index !== undefined ? box.index : idx) + ', page=' + (box.page !== undefined ? box.page : 0);

    // 验证 index
    if (box.index === undefined || box.index === null || box.index === '') {
      errorMessages.push(itemLabel + ': index为空');
      if (firstErrorArrayIdx === -1) { firstErrorArrayIdx = idx; firstErrorField = 'index'; }
    }

    // 验证 page
    if (box.page === undefined || box.page === null || box.page === '') {
      errorMessages.push(itemLabel + ': page为空');
      if (firstErrorArrayIdx === -1) { firstErrorArrayIdx = idx; firstErrorField = 'page'; }
    }

    // 验证 type
    if (!box.type) {
      errorMessages.push(itemLabel + ': type为空');
      if (firstErrorArrayIdx === -1) { firstErrorArrayIdx = idx; firstErrorField = 'type'; }
    }

    // 验证 location
    if (!box.location) {
      errorMessages.push(itemLabel + ': location为空');
      if (firstErrorArrayIdx === -1) { firstErrorArrayIdx = idx; firstErrorField = 'location'; }
    }

    // 验证 title_level
    if (box.title_level === undefined || box.title_level === null || box.title_level === '') {
      errorMessages.push(itemLabel + ': title_level为空');
      if (firstErrorArrayIdx === -1) { firstErrorArrayIdx = idx; firstErrorField = 'title_level'; }
    }

    // 验证 attach_index（必须为数字，-1表示无关联）
    var attachIndex = box.attach_index;
    if (attachIndex === undefined || attachIndex === null || attachIndex === '' || attachIndex === '-1') {
      // -1 表示无关联，不需要验证
    } else if (isNaN(Number(attachIndex))) {
      errorMessages.push(itemLabel + ': attach_index必须为数字');
      if (firstErrorArrayIdx === -1) { firstErrorArrayIdx = idx; firstErrorField = 'attach_index'; }
    } else {
      // attach_index ≠ -1 时，验证 attach_page（不能为 -1）
      var attachPage = box.attach_page;
      if (attachPage === undefined || attachPage === null || attachPage === '' || attachPage === '-1' || isNaN(Number(attachPage))) {
        errorMessages.push(itemLabel + ': attach_page必须为非-1的数字');
        if (firstErrorArrayIdx === -1) { firstErrorArrayIdx = idx; firstErrorField = 'attach_page'; }
      }
    }
  });

  if (errorMessages.length > 0) {
    // 高亮第一个错误的标注框面板项
    highlightErrorBox(firstErrorArrayIdx, firstErrorField);
    return { valid: false, errors: errorMessages };
  }

  return { valid: true, errors: [] };
}

// ========== 高亮错误标注框面板项 ==========
function highlightErrorBox(arrayIdx, fieldName) {
  if (arrayIdx < 0 || !boxesData[arrayIdx]) return;
  var box = boxesData[arrayIdx];
  var boxPage = parseInt(box.page);
  if (isNaN(boxPage)) boxPage = 0;

  // 如果错误不在当前页，先切换到对应页
  if (boxPage !== panelCurrentPage) {
    panelCurrentPage = boxPage;
    renderAnnotationUI();
  }

  // 延迟高亮，等待渲染完成
  setTimeout(function() {
    var targetItem = boxList.querySelector('.agi-box-item[data-index="' + arrayIdx + '"]');
    if (targetItem) {
      // 高亮整个面板项
      targetItem.classList.add('agi-box-error');
      // 高亮具体错误字段
      var field = targetItem.querySelector('.agi-field-' + fieldName);
      if (field) {
        field.classList.add('agi-field-error');
        field.scrollIntoView({ behavior: 'smooth', block: 'center' });
        field.focus();
      }
      // 3秒后移除高亮
      setTimeout(function() {
        targetItem.classList.remove('agi-box-error');
        if (field) field.classList.remove('agi-field-error');
      }, 3000);
    }
  }, 100);
}

// ========== 构建结果 ==========
function buildResult() {
  var validation = validateRequiredFields();
  if (!validation.valid) {
    showStatus('❌ 导出失败：存在空字段\n' + validation.errors.join('\n'), 'error');
    return null;
  }

  // 检查是否存在非顺时针的多边形标注框
  var nonClockwiseItems = [];
  var firstNonClockwiseIdx = -1;
  for (var i = 0; i < boxesData.length; i++) {
    var box = boxesData[i];
    var isPolygon = box.annotationType === 'POLYGON' ||
      (box.coords && box.coords.points && box.coords.points.length > 4);
    if (isPolygon && box.coords && box.coords.points && box.coords.points.length >= 3) {
      if (!isClockwise(box.coords)) {
        nonClockwiseItems.push(box.index !== undefined ? box.index : i);
        if (firstNonClockwiseIdx === -1) firstNonClockwiseIdx = i;
      }
    }
  }
  if (nonClockwiseItems.length > 0) {
    // 高亮第一个非顺时针的标注框面板项
    highlightErrorBox(firstNonClockwiseIdx, 'position');
    showStatus('❌ 导出失败：以下标注框未按顺时针方向标注：index=' + nonClockwiseItems.join(', index='), 'error');
    return null;
  }

  var version = 'v3.0';
  var updateTime = fetchedTime || getLocalTimeString();
  var blocks = [];  // V3.6: 先收集所有 block

  // 直接遍历boxesData获取所有页的数据（不再依赖DOM，避免分页导致只导出当前页）
  boxesData.forEach(function(box) {
    var position = coordsToPosition(box ? box.coords : null);
    var titleLevel = (box.title_level !== undefined && box.title_level !== null) ? box.title_level : -1;
    var attachRaw = box.attach_index !== undefined ? String(box.attach_index) : '-1';
    var attachVal = parseInt(attachRaw);
    var attachIndex = isNaN(attachVal) ? -1 : attachVal;

    // 构建 attach_info 对象（V3.9 新逻辑）
    var attachInfo;
    if (attachIndex === -1) {
      // attach_index = -1：attach_page 必须为 -1，is_truncated 为 null
      attachInfo = { attach_index: -1, attach_page: -1, is_truncated: null };
    } else {
      // attach_index ≠ -1：attach_page 必须 ≠ -1，is_truncated 根据复选框
      var attachPage = box.attach_page;
      // 确保 attach_page 不是 -1 或 null（如果无效则输出原值，由验证环节拦截）
      if (attachPage === null || attachPage === undefined || attachPage === '' || attachPage === '-1') {
        attachPage = -1; // 标记为无效，validateRequiredFields 会报错
      }
      var isTruncated = (box.is_truncated === true);
      attachInfo = {
        attach_index: attachIndex,
        attach_page: parseInt(attachPage),
        is_truncated: isTruncated
      };
    }

    // 构建 attribute 对象
    var attrObj = {
      type: box.type || '',
      location: box.location || '',
      title_level: isNaN(titleLevel) ? -1 : titleLevel,
      attach_info: attachInfo
    };

    blocks.push({
      page: (box.page !== undefined && box.page !== null) ? parseInt(box.page) : 0,
      index: (box.index !== undefined && box.index !== null) ? parseInt(box.index) : 0,
      position: position || [],
      attribute: attrObj,
      text: (box.description || box.text || '').replace(/\r\n|\r|\n/g, '\\n').replace(/\t/g, '\\t')
    });
  });

  // V3.6: 按页分组，生成 { page: X, blocks: [...] } 结构
  var pageMap = {};
  var pageOrder = [];
  blocks.forEach(function(block) {
    var pg = block.page;
    if (!pageMap[pg]) {
      pageMap[pg] = [];
      pageOrder.push(pg);
    }
    pageMap[pg].push(block);
  });
  // V4.2: 对每页的 blocks 按 index 排序，确保导出 JSON 规范，重新导入后框号与 index 对齐
  var contents = pageOrder.map(function(pg) {
    var sortedBlocks = pageMap[pg].slice().sort(function(a, b) {
      var idxA = parseInt(a.index);
      var idxB = parseInt(b.index);
      if (isNaN(idxA)) idxA = 0;
      if (isNaN(idxB)) idxB = 0;
      return idxA - idxB;
    });
    return { page: pg, blocks: sortedBlocks };
  });

  // V3.6: 使用导入的版本号，如果没有则默认 v3.0
  var outputVersion = importedVersion || version;

  return {
    agi_data_pdf_s3url: importedTopFields.agi_data_pdf_s3url || '',
    ocr_data_id: importedTopFields.ocr_data_id || '',
    meta_info: importedTopFields.meta_info || {},
    pdf_id: importedTopFields.pdf_id || '',
    data_batch: importedTopFields.data_batch || '',
    annotation_ocr_result: {
      update_time: updateTime,
      version: outputVersion,
      contents: contents
    }
  };
}

  // ========== 流式下载JSON文件 ==========
  function handleDownload() {
    // 第一步：同步 DOM 输入框值到 boxesData（与 handleExport 相同）
    boxList.querySelectorAll('.agi-box-item').forEach(function(boxItem) {
      var arrayIdx = parseInt(boxItem.dataset.index);
      if (isNaN(arrayIdx) || !boxesData[arrayIdx]) return;
      var box = boxesData[arrayIdx];
      var inputs = boxItem.querySelectorAll('input, select, textarea');
      inputs.forEach(function(el) {
        if (el.classList.contains('agi-field-index')) box.index = parseInt(el.value) || 0;
        else if (el.classList.contains('agi-field-page')) box.page = parseInt(el.value) || 0;
        else if (el.classList.contains('agi-field-type')) box.type = el.value;
        else if (el.classList.contains('agi-field-location')) box.location = el.value;
        else if (el.classList.contains('agi-field-title-level')) { var _tl3 = parseInt(el.value); box.title_level = isNaN(_tl3) ? -1 : _tl3; }
        else if (el.classList.contains('agi-field-attach-index')) box.attach_index = el.value;
        else if (el.classList.contains('agi-field-attach-page')) box.attach_page = el.value;
        else if (el.classList.contains('agi-field-text')) { box.description = el.value; box.text = el.value; }
        else if (el.classList.contains('agi-field-is-truncated')) { box.is_truncated = el.checked; }
      });
    });

    // 第二步：校验
    var validation = validateRequiredFields();
    if (!validation.valid) {
      showStatus('❌ 导出失败：存在空字段\n' + validation.errors.join('\n'), 'error');
      return;
    }

    // 第三步：流式构建 JSON 并直接下载
    var chunks = [];

    // 构建开头
    chunks.push('{"agi_data_pdf_s3url":"' + (importedTopFields.agi_data_pdf_s3url || '') + '",');
    chunks.push('"ocr_data_id":"' + (importedTopFields.ocr_data_id || '') + '",');
    chunks.push('"meta_info":' + JSON.stringify(importedTopFields.meta_info || {}) + ',');
    chunks.push('"pdf_id":"' + (importedTopFields.pdf_id || '') + '",');
    chunks.push('"data_batch":"' + (importedTopFields.data_batch || '') + '",');
    chunks.push('"annotation_ocr_result":{');
    chunks.push('"update_time":"' + (fetchedTime || getLocalTimeString()) + '",');
    chunks.push('"version":"' + (importedVersion || 'v3.0') + '",');
    chunks.push('"contents":[');

    // 按页分组
    var pageMap = {};
    var pageOrder = [];
    boxesData.forEach(function(box) {
      var pg = (box.page !== undefined && box.page !== null) ? parseInt(box.page) : 0;
      if (!pageMap[pg]) {
        pageMap[pg] = [];
        pageOrder.push(pg);
      }
      pageMap[pg].push(box);
    });

    // 逐页构建
    var isFirstPage = true;
    pageOrder.forEach(function(pg) {
      if (!isFirstPage) chunks.push(',');

      var blocks = [];
      pageMap[pg].forEach(function(box) {
        var titleLevel = (box.title_level !== undefined && box.title_level !== null) ? box.title_level : -1;
        var attachRaw = box.attach_index !== undefined ? String(box.attach_index) : '-1';
        var attachVal = parseInt(attachRaw);
        var attachIndex = isNaN(attachVal) ? -1 : attachVal;

        var attachInfo;
        if (attachIndex === -1) {
          attachInfo = { attach_index: -1, attach_page: -1, is_truncated: null };
        } else {
          var attachPage = box.attach_page;
          if (attachPage === null || attachPage === undefined || attachPage === '' || attachPage === '-1') {
            attachPage = -1;
          }
          attachInfo = {
            attach_index: attachIndex,
            attach_page: parseInt(attachPage),
            is_truncated: (box.is_truncated === true)
          };
        }

        var attrObj = {
          type: box.type || '',
          location: box.location || '',
          title_level: isNaN(titleLevel) ? -1 : titleLevel,
          attach_info: attachInfo
        };

        blocks.push(JSON.stringify({
          page: (box.page !== undefined && box.page !== null) ? parseInt(box.page) : 0,
          index: (box.index !== undefined && box.index !== null) ? parseInt(box.index) : 0,
          position: coordsToPosition(box.coords) || [],
          attribute: attrObj,
          text: (box.description || box.text || '').replace(/\r\n|\r|\n/g, '\\n').replace(/\t/g, '\\t')
        }));
      });

      // 按 index 排序
      blocks.sort(function(a, b) {
        var idxA = parseInt(JSON.parse(a).index);
        var idxB = parseInt(JSON.parse(b).index);
        if (isNaN(idxA)) idxA = 0;
        if (isNaN(idxB)) idxB = 0;
        return idxA - idxB;
      });

      chunks.push('{"page":' + pg + ',"blocks":[' + blocks.join(',') + ']}');
      isFirstPage = false;
    });

    chunks.push(']}}');

    // 直接创建 Blob 下载
    var blob = new Blob(chunks, {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'annotation_' + Date.now() + '.json';
    a.click();
    URL.revokeObjectURL(url);

    showStatus('📥 已下载 JSON 文件', 'info');
  }

  // ========== 缓存操作（V4.6：精简缓存，避免 localStorage 溢出） ==========
  function getCacheKey() {

  function saveToCache() {

      var cacheImageUrl = (!imageUrl || imageUrl.startsWith('data:')) ? '' : imageUrl;

  function restoreFromCache() {

      boxesData = cache.boxesData;

      // V4.6: 恢复 importedTopFields，修复刷新后 URL 字段为空的问题
      importedTopFields = cache.importedTopFields || {
        agi_data_pdf_s3url: '',
        ocr_data_id: '',
        meta_info: {},
        pdf_id: '',
        data_batch: ''
      };

      // V4.6: 恢复 panelCurrentPage，确保渲染正确的页面

  // ========== 标准化导入项 ==========
  function normalizeItem(raw) {
    var item = {};
    // 确保 page 和 index 是数字类型，NaN 时设为 0
    var parsedIndex = raw.index !== undefined ? parseInt(raw.index) : 0;
    var parsedPage = raw.page !== undefined ? parseInt(raw.page) : 0;
    item.index = isNaN(parsedIndex) ? 0 : parsedIndex;
    item.page = isNaN(parsedPage) ? 0 : parsedPage;
    item.position = raw.position;
    item.text = raw.text !== undefined ? raw.text : '';
    item.format_text = raw.format_text !== undefined ? raw.format_text : '';

    var attr = raw.attribute || {};
    item.type = attr.type || raw.type || 'paragraph';
    item.location = attr.location || raw.location || 'main';
    item.title_level = attr.title_level !== undefined ? attr.title_level : (raw.title_level !== undefined ? raw.title_level : -1);

    // 处理 attach_info（V3.6 新格式）
    var attachInfo = attr.attach_info || {};
    if (attachInfo.attach_index !== undefined) {
      // 新格式：attach_info.attach_index
      item.attach_index = attachInfo.attach_index;
      // V3.6：attach_index = -1 时，attach_page 也设为 -1
      if (attachInfo.attach_index === -1) {
        item.attach_page = -1;
      } else {
        item.attach_page = attachInfo.attach_page !== undefined ? attachInfo.attach_page : null;
      }
      item.is_truncated = attachInfo.is_truncated !== undefined ? attachInfo.is_truncated : false;
    } else {
      // 旧格式兼容
      item.attach_index = attr.attach_index !== undefined ? attr.attach_index : (raw.attach_index !== undefined ? raw.attach_index : -1);
      item.attach_page = item.attach_index === -1 ? -1 : null;
      item.is_truncated = false;
    }

    if (raw.version) item.version = raw.version;

    // V4.4: 保留 attribute 引用，确保后续创建 box 时能正确读取 attach_info
    item.attribute = attr;

    return item;
  }

    var newTop = startTop + dy;

  // ========== 处理初始化数据 ==========
  function handleInitData(data) {
    initData = data;
    var value = data.value || data;

    if (typeof value === 'string') {
      try {
        value = JSON.parse(value);
      } catch(e) {
        console.log('[Benchmark V3] 初始化数据解析失败:', e.message);
      }
    }

    // 保存顶层字段（用于导出时原样保留）
    importedTopFields = {
      agi_data_pdf_s3url: value.agi_data_pdf_s3url || '',
      ocr_data_id: value.ocr_data_id || '',
      meta_info: value.meta_info || {},
      pdf_id: value.pdf_id || '',
      data_batch: value.data_batch || ''
    };

    // V3.6: 读取 annotation_ocr_result 包装对象
    var ocrResult = value.annotation_ocr_result || {};
    importedVersion = ocrResult.version || '';
    importedUpdateTime = ocrResult.update_time || '';

    // 加载图片
    if (value && value.image_url) {
      loadImage(value.image_url);
    }

    var contents = [];
    // V3.6: 优先从 annotation_ocr_result.contents 读取
    if (value && ocrResult.contents && Array.isArray(ocrResult.contents)) {
      contents = ocrResult.contents;
    } else if (value && value.contents && Array.isArray(value.contents)) {
      contents = value.contents;
    } else if (Array.isArray(value)) {
      contents = [];
    }

    // V3.6: 处理 contents 格式，支持 { page: X, blocks: [...] } 和扁平数组
    var allBlocks = [];
    contents.forEach(function(item) {
      if (item && item.blocks && Array.isArray(item.blocks)) {
        // { page: X, blocks: [...] } 格式
        var pageNum = parseInt(item.page);
        if (isNaN(pageNum)) pageNum = 0;
        item.blocks.forEach(function(block, blockIdx) {
          // 如果 block 没有 page 字段或为 null/空字符串，使用外层的 pageNum
          if (block.page === undefined || block.page === null || block.page === '') {
            block.page = pageNum;
          }
          allBlocks.push(block);
        });
      } else {
        // 扁平数组格式
        allBlocks.push(item);
      }
    });

    if (allBlocks.length > 0) {
      boxesData = [];
      panelCurrentPage = 0;
      // V3.6: 检查重复的 page+index 组合
      var pageIndexMap = {};
      allBlocks.forEach(function(item, i) {
        var normalizedItem = normalizeItem(item);
        var key = normalizedItem.page + '_' + normalizedItem.index;
        if (pageIndexMap[key] !== undefined) {
          console.warn('发现重复的 page+index: page=' + normalizedItem.page + ', index=' + normalizedItem.index + '，跳过第 ' + i + ' 项');
          return; // 跳过重复项
        }
        pageIndexMap[key] = i;
        // 解析attribute字段
        var attr = normalizedItem.attribute || {};
        // 解析 attach_info（V3.6 新格式）
        var attachInfo = attr.attach_info || {};
        var importedAttachIndex = attachInfo.attach_index !== undefined ? attachInfo.attach_index : null;
        // 如果 attach_index 是 null，则设为 -1（表示无关联）
        if (importedAttachIndex === null || importedAttachIndex === undefined) {
          importedAttachIndex = -1;
        }
        // V3.6：attach_index = -1 时，attach_page 也设为 -1
        var initAttachPage = importedAttachIndex === -1 ? -1 : (attachInfo.attach_page !== undefined ? attachInfo.attach_page : null);
        var box = {
          index: normalizedItem.index !== undefined ? normalizedItem.index : i,
          page: normalizedItem.page !== undefined ? normalizedItem.page : (attr.page !== undefined ? attr.page : 0),
          type: normalizedItem.type || attr.type || 'paragraph',
          location: normalizedItem.location || attr.location || 'main',
          title_level: normalizedItem.title_level !== undefined ? normalizedItem.title_level : (attr.title_level !== undefined ? attr.title_level : -1),
          attach_index: importedAttachIndex,
          attach_page: initAttachPage,
          is_truncated: attachInfo.is_truncated !== undefined ? attachInfo.is_truncated : false,
          coords: null,
          description: normalizedItem.text || '',
          text: normalizedItem.text || ''
        };

        if (normalizedItem.position && Array.isArray(normalizedItem.position)) {
          var pos = normalizedItem.position;
          if (pos.length === 4) {
            box.coords = { x1: pos[0], y1: pos[1], x2: pos[2], y2: pos[3] };
          } else if (pos.length >= 6 && pos.length % 2 === 0) {
            var points = [];
            for (var j = 0; j < pos.length; j += 2) {
              points.push({ x: pos[j], y: pos[j+1] });
            }
            if (points.length === 4 && isAxisAlignedRect(points)) {
              var xs = points.map(function(p) { return p.x; });
              var ys = points.map(function(p) { return p.y; });
              box.coords = {
                x1: Math.min.apply(null, xs), y1: Math.min.apply(null, ys),
                x2: Math.max.apply(null, xs), y2: Math.max.apply(null, ys)
              };
            } else {
              box.coords = { points: points };
              box.annotationType = 'POLYGON';
            }
          }
        }

        box._importData = normalizedItem;
        boxesData.push(box);
      });

      fetchedTime = getLocalTimeString();
      renderAnnotationUI();


      // V3.6: 优先使用 annotation_ocr_result.update_time
      if (importedUpdateTime) {
        fetchedTime = importedUpdateTime;
      } else if (value && value.update_time) {
        fetchedTime = value.update_time;
      }

      updateAttachHighlight();
      // 应用关联组颜色
      applyBoxGroupColors();
      // 导入后更新 is_truncated 可见性
      var allAttachInputs = boxList.querySelectorAll('.agi-field-attach-index');
      allAttachInputs.forEach(function(input) {
        toggleIsTruncatedVisibility(input);
      });
      saveToCache();

      // V3.6: 自动从 agi_data_pdf_s3url 加载 PDF
      var pdfUrl = value.agi_data_pdf_s3url || '';
      if (pdfUrl && pdfUrl.trim() !== '') {
        console.log('[Benchmark V3] 从 agi_data_pdf_s3url 自动加载 PDF:', pdfUrl);
        loadPDF(pdfUrl);
      }
    }
  }

  // ========== 窗口大小变化时重新渲染标注框 ==========
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      if (imageEl && !imageEl.classList.contains('agi-hidden')) {
        imageDisplayWidth = imageEl.width;
        imageDisplayHeight = imageEl.height;
        renderAnnotationBoxes();
      }
    }, 200);
  });

  // ========== 本地测试模式 ==========
  function applyLocalData(file, jsonStr) {
    var data = {};
    if (jsonStr) {
      try {
        var parsed = JSON.parse(jsonStr);
        if (Array.isArray(parsed)) {
          data.contents = parsed;
        } else if (parsed && typeof parsed === 'object') {
          // V3.6: 优先从 annotation_ocr_result 读取
          var ocrResult = parsed.annotation_ocr_result || {};
          var contentsFound = false;
          if (Array.isArray(ocrResult.contents) && ocrResult.contents.length > 0) {
            data.contents = ocrResult.contents;
            contentsFound = true;
          } else {
            var arrayKeys = ['contents', 'items', 'annotations', 'results', 'data'];
            for (var ki = 0; ki < arrayKeys.length; ki++) {
              if (Array.isArray(parsed[arrayKeys[ki]]) && parsed[arrayKeys[ki]].length > 0) {
                data.contents = parsed[arrayKeys[ki]];
                contentsFound = true;
                break;
              }
            }
          }
          // V3.6: 从 annotation_ocr_result 读取 version/update_time
          if (ocrResult.version) data.version = ocrResult.version;
          else if (parsed.version) data.version = parsed.version;
          if (ocrResult.update_time) data.update_time = ocrResult.update_time;
          else if (parsed.update_time) data.update_time = parsed.update_time;
          // 保存顶层字段（V3.6 新格式），但不用于渲染
          if (parsed.agi_data_pdf_s3url !== undefined) data.agi_data_pdf_s3url = parsed.agi_data_pdf_s3url;
          if (parsed.ocr_data_id !== undefined) data.ocr_data_id = parsed.ocr_data_id;
          if (parsed.meta_info !== undefined) data.meta_info = parsed.meta_info;
          if (parsed.pdf_id !== undefined) data.pdf_id = parsed.pdf_id;
          if (parsed.data_batch !== undefined) data.data_batch = parsed.data_batch;
        }
      } catch(e) {
        showStatus('❌ JSON解析失败: ' + e.message, 'error');
        return;
      }
    }

    // 优先使用本地文件渲染
    if (file) {
      loadLocalFile(file);
    }

    if (data.contents && data.contents.length > 0) {
      handleInitData(data);
    } else if (!file) {
      showStatus('⚠️ 未找到有效的标注数据', 'error');
    }
  }

  // 检查URL参数
  function checkUrlParams() {
    var params = new URLSearchParams(window.location.search);
    if (params.get('demo') === '1') {
      var demoData = generateDemoData();
      setTimeout(function() {
        applyLocalData(null, JSON.stringify(demoData));
        showStatus('🎯 已加载示例数据', 'info');
      }, 500);
      return true;
    }
    return false;
  }

  // ========== 初始化 ==========
  initPanelZoom();

  // 滚动条控制按钮事件 - 一键到顶/到底
  var scrollControls = document.getElementById('agi-scrollbar-controls');
  var scrollTopBtn = document.getElementById('agi-scroll-top-btn');
  var scrollBottomBtn = document.getElementById('agi-scroll-bottom-btn');
  var panelBody = panel.querySelector('.agi-panel-body');

  if (scrollTopBtn && scrollBottomBtn && panelBody) {
    scrollTopBtn.addEventListener('click', function() {
      panelBody.scrollTop = 0;
    });
    scrollBottomBtn.addEventListener('click', function() {
      panelBody.scrollTop = panelBody.scrollHeight;
    });
  }

  restoreFromCache();
  checkUrlParams();

  // ========== 独立版初始化（无平台依赖） ==========
  console.log('[Benchmark V3 标注工具] 已加载完成，版本 V4.6（支持PDF）');

})();
</script>
